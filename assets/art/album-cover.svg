<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="600" height="780" role="img" aria-label="走向明天 封面">
  <defs>
    <linearGradient id="cvg" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6a8570"/><stop offset="0.5" stop-color="#526b58"/><stop offset="1" stop-color="#3c5245"/>
    </linearGradient>
    <radialGradient id="cvgl" cx="0.5" cy="0.36" r="0.72">
